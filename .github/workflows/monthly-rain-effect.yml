name: monthly-rain-effect

# Re-measures how much rain changes pedestrian counts over the last 12 months
# (pipeline/rain_effect.py) and replaces the rain_effect table.
on:
  schedule:
    - cron: "13 17 1 * *" # 17:13 UTC on the 1st = 03:13 AEST / 04:13 AEDT on the 2nd
  workflow_dispatch:

# Same group as the hourly job, so the two never write at the same time: a run
# that starts while the other is in progress waits for it. If this run is ever
# cancelled while waiting (GitHub keeps only the newest waiting run in a
# group), start it again from the Actions tab.
concurrency:
  group: hourly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rain-effect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements*.txt

      - run: pip install -r requirements-dev.txt

      # Nothing is written unless the tests pass.
      - name: Tests
        run: pytest -q

      - name: Measure the rain effect
        run: python rain_effect.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
