name: daily-forecast

on:
  schedule:
    - cron: "37 17 * * *" # 17:37 UTC = 03:37 AEST / 04:37 AEDT
  workflow_dispatch:

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: model
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/requirements*.txt

      - run: pip install -r requirements-dev.txt

      # No forecasts are written unless the feature tests pass.
      - name: Tests
        run: pytest -q

      # Settle yesterday's flagged hours against the city's published hourly totals:
      # confirmed real (unflagged, usable as history) or confirmed feed fault (stays
      # excluded). Runs first so the forecast below uses the outcome. It never fails
      # the job on a city API problem.
      - name: Resolve flagged hours
        working-directory: pipeline
        run: python audit.py --resolve
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Forecast next 24 hours
        run: python predict.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
