name: fetch-data

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 UTC (off the :00 rush, runs start faster)
  workflow_dispatch:       # lets you click "Run workflow" to test it

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch City of Melbourne data
        run: python fetch.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
