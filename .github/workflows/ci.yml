name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements*.txt
      # The Plan API's logic is TypeScript (web/lib/plan-core.ts); its pytest
      # checks run it with Node and are skipped on anything older than 22.18.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Dry run against live feeds
        run: python fetch.py --dry-run

  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: model
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Dry run forecast against live history
        run: python predict.py --dry-run

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
